# Auto-switch gamemode when changing worlds?
# This is ONLY supposed to switch them to survival (if they were in creative).
auto_switch_worlds: true

# Map world names to the gamemode the player should be set to upon entering
# Valid values: SURVIVAL, CREATIVE, ADVENTURE, SPECTATOR
world_gamemodes:
  spawn: SURVIVAL
  world: SURVIVAL
  world_nether: SURVIVAL
  world_the_end: SURVIVAL

# Restrictions while in CREATIVE mode (only applies if player does NOT have bypass permission)
restrictions:
  creative:
    block_place: false
    block_break: false
    item_drop: false
    item_pickup: false

    # Blocks that are BOTH place AND break-restricted while in CREATIVE mode.
    block_restrictions:
      - ARMOR_STAND
      - AXOLOTL_SPAWN_EGG
      - BAT_SPAWN_EGG
      - BEDROCK
      - BEE_SPAWN_EGG
