    # List of inventory types that players in Creative cannot open
    restricted_container_types:
      - CHEST
      - TRAPPED_CHEST
      - ENDER_CHEST
      - FURNACE
      - DISPENSER
      - DROPPER
      - HOPPER
      - BREWING_STAND
      - ENCHANTING_TABLE
      - ANVIL
      - BEACON
      - SHULKER_BOX
      - BARREL

    # Commands players cannot run while in Creative mode (bypass permission excluded).
    # Do not include the leading '/'. Only the base command/label is checked
    # (e.g. "give" also blocks "/give" and "/minecraft:give", but not subcommands).
    command_blacklist: []

# Prevents item drops caused by gravity-affected blocks (e.g. anvils, sand, gravel,
# concrete powder) landing/breaking. Applies server-wide, not just to Creative players.
prevent_falling_block_drops: false

# Messages
messages:
  # Master switch for all automatic in-game feedback messages (gamemode changed,
  # inventory loaded/saved, and restriction "denied" messages). Turn this off if
  # it gets too spammy - for example when item_pickup and item_drop restrictions
  # are both enabled and players are constantly triggering denial messages.
  # This does NOT affect direct command responses like /gmmanage status or reload.
  enabled: true

  no_permission: "&cYou don't have permission to use this feature!"
  reloaded: "&aConfiguration reloaded!"
  status_header: "&6GameModeManager Status"
  status_auto_switch: "&7Auto world-switch: &a{enabled}"
  status_world_mappings: "&7World mappings:"
  status_restrictions: "&7Restrictions (creative):"
  status_line: "  &7{action}: &a{state}"
  inventory_loaded: "&aLoaded {gamemode} inventory for {player}"
  inventory_saved: "&aSaved {gamemode} inventory for {player}"
  gamemode_changed: "&aGamemode changed to {gamemode} for {player}"
  container_access_denied: "&cYou cannot open containers in Creative mode!"
  block_break_denied: "&cYou cannot break that block in Creative mode!"
  item_drop_denied: "&cYou cannot drop items in Creative mode!"
  item_pickup_denied: "&cYou cannot pick up items in Creative mode!"
  command_blocked: "&cThat command is disabled in Creative mode!"
